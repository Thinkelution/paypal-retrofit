# Render Blueprint: deploys the Fernhill demo (console + legacy app + mock PayPal) as one web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: paypal-retrofit-demo
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm retrofit demo --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RETROFIT_DASHBOARD_PASSWORD
        sync: false
      - key: RETROFIT_MODEL
        value: claude-opus-5-5
      # Approval links in the digest stay valid across restarts of the temporary disk.
      - key: RETROFIT_LINK_SECRET
        generateValue: true
      # Bearer token for the MCP endpoint when the console has a password.
      - key: RETROFIT_MCP_TOKEN
        sync: false

